{% extends "base.html" %}
{% block title %}Friend Requests{% endblock %}
{% block content %}
<div class="requests-wrapper">
    <div class="requests-header">
        <a href="{{ url_for('chat') }}" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h2>Friend Requests</h2>
    </div>
    <ul class="requests-list">
        {% for req in requests %}
        <li>
            <span>{{ req.sender_username }}</span>
            <div>
                <button class="accept-request" data-id="{{ req.id }}"><i class="fas fa-check"></i></button>
                <button class="reject-request" data-id="{{ req.id }}"><i class="fas fa-times"></i></button>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>
<script>
    document.querySelectorAll('.accept-request').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            await fetch(`/accept_request/${id}`, { method: 'POST' });
            location.reload();
        });
    });
    document.querySelectorAll('.reject-request').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            await fetch(`/reject_request/${id}`, { method: 'POST' });
            location.reload();
        });
    });
</script>
{% endblock %}
