{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-whatsapp"></i>
            <h2>WhatsApp Clone</h2>
        </div>
        <form id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
    </div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const data = new FormData(form);
        const response = await fetch('/login', {
            method: 'POST',
            body: data
        });
        const result = await response.json();
        if (result.success) {
            sessionStorage.setItem('user_id', result.user_id);
            sessionStorage.setItem('username', result.username);
            sessionStorage.setItem('public_key', result.public_key);
            sessionStorage.setItem('encrypted_private_key', result.encrypted_private_key);
            window.location.href = '/chat';
        } else {
            alert('Login failed: ' + result.error);
        }
    });
</script>
{% endblock %}
