{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block content %}
<div class="app-container" style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
    <!-- Header with menu and title -->
    <div style="background: #202c33; padding: 10px 16px; display: flex; align-items: center; color: white; flex-shrink: 0;">
        <button id="menuToggle" style="background: none; border: none; color: white; font-size: 24px; margin-right: 20px;">☰</button>
        <span id="chatHeader" style="font-size: 18px;">Select a chat</span>
    </div>

    <!-- Messages area - takes all available space -->
    <div id="messages" style="flex: 1; overflow-y: auto; padding: 10px; background: #0b141a;"></div>

    <!-- Fixed input area at bottom -->
    <div id="messageInputContainer" style="background: #202c33; padding: 10px; border-top: 1px solid #2a3942; display: flex; align-items: center; flex-shrink: 0;">
        <textarea id="messageText" placeholder="Type a message" style="flex: 1; background: #2a3942; border: none; border-radius: 8px; padding: 10px; color: white; margin-right: 10px; height: 40px;" disabled></textarea>
        <input type="file" id="photoInput" accept="image/*" style="display: none;">
        <button id="photoBtn" style="background: #28a745; border: none; border-radius: 8px; padding: 8px 12px; color: white; margin-right: 5px;" disabled>📷</button>
        <button id="sendBtn" style="background: #007bff; border: none; border-radius: 8px; padding: 8px 12px; color: white;" disabled>Send</button>
    </div>
</div>

<!-- Sidebar overlay and sidebar -->
<div id="sidebarOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 5;"></div>
<div id="sidebar" style="position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #111b21; transition: left 0.3s; z-index: 10; overflow-y: auto;">
    <div style="background: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
        <span style="color: white; font-weight: bold;">{{ username }}</span>
        <button id="logoutBtn" style="background: #dc3545; border: none; border-radius: 4px; padding: 5px 10px; color: white;">Logout</button>
    </div>
    <div style="padding: 10px;">
        <input type="text" id="searchInput" placeholder="Search users..." style="width: 100%; padding: 8px; background: #202c33; border: none; border-radius: 4px; color: white;">
    </div>
    <div id="searchResults" style="padding: 0 10px;"></div>
    <div style="padding: 10px;">
        <a href="{{ url_for('list_requests') }}" style="color: #00a884; text-decoration: none;">Friend Requests</a>
    </div>
    <div id="friendsList" style="padding: 10px;"></div>
</div>

<script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
